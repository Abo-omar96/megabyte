<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحاسبة وإدارة الشبكات السحابية | MegaByte Cloud Ledger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .font-mono, td, th, input[type="number"] { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-gradient-to-tr from-emerald-600 to-emerald-400 text-slate-950 p-2.5 rounded-2xl font-black text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-server"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base text-white tracking-wide">منصة MegaByte المحاسبية والسحابية</h1>
                    <p class="text-[11px] text-emerald-400 font-semibold tracking-wider">نظام سحابي متكامل ومزامن للبيانات وتوزيع الأرباح</p>
                </div>
            </div>

            <!-- Cloud Sync Indicator -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div id="cloudBadge" class="flex items-center space-x-2 space-x-reverse text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-slate-400 shadow-inner">
                    <span id="cloudDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="cloudText">جاري الاتصال السحابي...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- App Layout Container (Sidebar + Main Content) -->
    <div class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
        
        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl no-print space-y-2 sticky top-20">
            <h3 class="text-xs font-bold text-slate-400 uppercase px-3 pb-2 tracking-wider border-b border-slate-800">قائمة النظام</h3>
            <nav class="space-y-1">
                <button data-tab="snapshots" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse bg-emerald-600 text-slate-950 shadow-md cursor-pointer">
                    <i class="fa-solid fa-camera-retro w-5 text-center"></i> <span>لقطات الرصيد (حساب)</span>
                </button>
                <button data-tab="wallets" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-wallet w-5 text-center"></i> <span>المحافظ والماكينات (كاش)</span>
                </button>
                <button data-tab="customers" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-address-book w-5 text-center"></i> <span>ديون العملاء (الخرج)</span>
                </button>
                <button data-tab="partners" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-hand-holding-dollar w-5 text-center"></i> <span>الشركاء وتوزيع الأرباح</span>
                </button>
                <button data-tab="network" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-network-wired w-5 text-center"></i> <span>إدارة أجهزة الـ IP</span>
                </button>
                <button data-tab="clientwe" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-phone w-5 text-center"></i> <span>بيانات خطوط WE</span>
                </button>
                <button data-tab="orders" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-list-check w-5 text-center"></i> <span>أوردرات الصيانة والتنفيذ</span>
                </button>
                <button data-tab="reports" class="tab-btn w-full px-4 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-3 space-x-reverse text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i> <span>التقارير الشاملة والتحليلات</span>
                </button>
            </nav>
        </aside>

        <!-- Main Workspace Area -->
        <main class="lg:col-span-3 space-y-6 w-full">
            
            <!-- Room Sync Setup Banner -->
            <div class="bg
